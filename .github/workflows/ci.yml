name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      # Zero runtime dependencies: no install step needed.
      - name: Public contract suite
        run: npm test

      - name: Smoke test CLI help
        run: node bin/flowtrace.js --help

      - name: Worked example end to end
        run: |
          set -e
          cd examples/demo-shop
          node ../../bin/flowtrace.js extract  --config flowtrace.config.json
          node ../../bin/flowtrace.js join     --config flowtrace.config.json
          node ../../bin/flowtrace.js cover    --config flowtrace.config.json --area ../../areas/checkout.txt
          node ../../bin/flowtrace.js span     --config flowtrace.config.json "POST orders/v1/checkout"
          node ../../bin/flowtrace.js surface  --config flowtrace.config.json "POST orders/v1/checkout"
          node ../../bin/flowtrace.js skeleton --config flowtrace.config.json "POST orders/v1/checkout"
          node ../../bin/flowtrace.js check    --config flowtrace.config.json --area ../../areas/checkout.txt --baseline out/checkout.baseline.json --write-baseline
          node ../../bin/flowtrace.js check    --config flowtrace.config.json --area ../../areas/checkout.txt --baseline out/checkout.baseline.json
          node ../../bin/flowtrace.js calibrate --golden calibration --verdicts calibration/reference

      - name: No machine paths in the tree
        run: bash scripts/path-check.sh

      - name: Documentation matches the CLI and links resolve
        run: node scripts/docs-check.mjs

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha has no Signed-off-by trailer — run: git commit --amend -s"
              missing=1
            fi
          done
          exit "$missing"
