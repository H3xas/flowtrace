name: CI

# A release branch takes integration pull requests of its own, so the gate runs there too:
# otherwise a change merged into one arrives with no canonical check to require.
on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      # Full history, so the commit-artifact stages can read the range under review.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      # The range whose commits the canonical command reads. A pull request is checked
      # against its base; a push against the commits it added, falling back to the pushed
      # head alone when the branch has no earlier tip to compare with.
      - name: Resolve the commit range under review
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            range="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)..$(git rev-parse HEAD)"
          else
            range="${{ github.event.before }}..${{ github.event.after }}"
          fi
          echo "VERIFY_COMMIT_RANGE=$range" >> "$GITHUB_ENV"

      # Zero runtime dependencies: no install step needed. Everything CI requires of a
      # change is in this command, which is the same one CONTRIBUTING.md tells a
      # contributor to run.
      - name: Verify
        run: npm run verify
