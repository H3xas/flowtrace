name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  binaries:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Build single-executable binary
        run: node scripts/build-sea.mjs

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/flowtrace-*

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binary (keyless)
        shell: bash
        run: |
          set -e
          asset=$(ls dist/flowtrace-*)
          cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"

      - name: Ensure GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" --generate-notes || true

      - name: Upload binary and signature assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" dist/flowtrace-* --clobber

  npm-tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Pack npm tarball
        run: npm pack

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: '*.tgz'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign tarball (keyless)
        run: |
          set -e
          asset=$(ls ./*.tgz)
          cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"

      - name: Ensure GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --title "$TAG" --generate-notes || true

      - name: Upload npm tarball, SBOM and signature assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" ./*.tgz ./*.sigstore.json sbom.cdx.json --clobber

  checksums:
    needs: [binaries, npm-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" --dir release-assets --clobber

      - name: Write SHA256SUMS
        run: |
          set -e
          cd release-assets
          node -e '
            const { createHash } = require("node:crypto");
            const { readdirSync, readFileSync, writeFileSync } = require("node:fs");
            const files = readdirSync(".").filter((f) => f !== "SHA256SUMS").sort();
            const lines = files.map((f) => `${createHash("sha256").update(readFileSync(f)).digest("hex")}  ${f}`);
            writeFileSync("SHA256SUMS", lines.join("\n") + "\n");
          '
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload "${GITHUB_REF_NAME}" release-assets/SHA256SUMS --clobber

  publish-npm:
    needs: [npm-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) needs no npm token, but does need a recent npm CLI.
      # One-time npmjs.com setup: see RELEASING.md.
      - name: Update npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: Publish with provenance
        run: npm publish --provenance --access public
